<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お誕生日おめでとう</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #12122a;
    --night-deep: #0a0a1a;
    --gold: #f2b544;
    --gold-soft: #ffd98a;
    --sakura: #ff6f91;
    --sakura-soft: #ffb3c6;
    --paper: #fff8ec;
    --paper-card: #fffaf0;
    --ink: #3a2f2f;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--night);
    color: var(--paper);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    overflow-x: hidden;
    min-height: 100%;
  }

  /* ============ ローディング画面 ============ */
  #loading {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--night-deep);
    transition: opacity 0.9s ease, visibility 0.9s ease;
  }
  #loading.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .loader-lantern {
    width: 64px;
    height: 84px;
    position: relative;
    margin-bottom: 28px;
  }
  .loader-lantern .string {
    position: absolute;
    top: -30px;
    left: 50%;
    width: 1px;
    height: 30px;
    background: rgba(255,255,255,0.15);
  }
  .loader-lantern .body {
    position: absolute;
    top: 6px;
    left: 50%;
    transform: translateX(-50%);
    width: 52px;
    height: 68px;
    border-radius: 50% / 40%;
    background: radial-gradient(circle at 50% 40%, rgba(242,181,68,0.15), rgba(242,181,68,0.05) 70%);
    box-shadow: 0 0 0 rgba(242,181,68,0);
    animation: lightUp 2.2s ease-in-out forwards;
  }
  @keyframes lightUp {
    0%   { background: radial-gradient(circle at 50% 40%, rgba(242,181,68,0.1), rgba(242,181,68,0.03) 70%); box-shadow: 0 0 0 rgba(242,181,68,0); }
    100% { background: radial-gradient(circle at 50% 40%, var(--gold-soft), var(--gold) 70%); box-shadow: 0 0 24px rgba(242,181,68,0.7), 0 0 50px rgba(242,181,68,0.3); }
  }

  .loader-text {
    font-family: 'Shippori Mincho', serif;
    font-size: 13px;
    letter-spacing: 0.3em;
    color: rgba(255,248,236,0.55);
  }
  .loader-text .dot {
    animation: blink 1.4s infinite;
  }
  .loader-text .dot:nth-child(2) { animation-delay: 0.2s; }
  .loader-text .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink {
    0%, 100% { opacity: 0.2; }
    50% { opacity: 1; }
  }

  /* ============ 背景 ============ */
  .sky {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 10%, rgba(255,255,255,0.06), transparent 40%),
      radial-gradient(ellipse at 80% 30%, rgba(255,255,255,0.05), transparent 45%),
      linear-gradient(180deg, var(--night-deep) 0%, var(--night) 55%, #1c1c3a 100%);
    z-index: 0;
  }
  .stars {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }
  .star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: #fff;
    border-radius: 50%;
    opacity: 0.6;
    animation: twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.2; }
    50% { opacity: 0.9; }
  }

  /* 桜の花びら（常に画面に動きを出す） */
  .petals {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    overflow: hidden;
  }
  .petal {
    position: absolute;
    top: -20px;
    width: 10px;
    height: 10px;
    background: linear-gradient(135deg, var(--sakura-soft), var(--sakura));
    border-radius: 60% 0 60% 0;
    opacity: 0.55;
    animation: petalFall linear infinite;
  }
  @keyframes petalFall {
    0% { transform: translate(0, -5vh) rotate(0deg); opacity: 0; }
    10% { opacity: 0.6; }
    90% { opacity: 0.4; }
    100% { transform: translate(40px, 105vh) rotate(320deg); opacity: 0; }
  }

  main {
    position: relative;
    z-index: 2;
    max-width: 720px;
    margin: 0 auto;
    padding: 64px 24px 120px;
    text-align: center;
    opacity: 0;
    transform: translateY(16px);
    transition: opacity 1s ease, transform 1s ease;
  }
  main.reveal {
    opacity: 1;
    transform: translateY(0);
  }

  /* ============ ヒーローアバター ============ */
  .hero-avatar {
    width: 92px;
    height: 92px;
    margin: 0 auto 20px;
    border-radius: 50%;
    position: relative;
    padding: 4px;
    background: conic-gradient(from 0deg, var(--gold), var(--sakura-soft), var(--gold-soft), var(--gold));
    animation: heroSpin 6s linear infinite;
  }
  .hero-avatar img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    background: var(--night-deep);
  }
  @keyframes heroSpin {
    to { transform: rotate(360deg); }
  }

  .eyebrow {
    font-family: 'Shippori Mincho', serif;
    letter-spacing: 0.4em;
    font-size: 12px;
    color: var(--gold-soft);
    opacity: 0.8;
    margin-bottom: 18px;
  }

  h1 {
    font-family: 'Shippori Mincho', serif;
    font-weight: 700;
    font-size: clamp(34px, 8vw, 56px);
    line-height: 1.4;
    margin: 0 0 8px;
    background: linear-gradient(180deg, #fff 0%, var(--sakura-soft) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .name-slot {
    color: var(--gold-soft);
    -webkit-text-fill-color: var(--gold-soft);
  }

  .lede {
    font-size: 15px;
    line-height: 1.9;
    color: rgba(255,248,236,0.75);
    max-width: 440px;
    margin: 20px auto 0;
  }

  .hint {
    margin-top: 28px;
    font-size: 12px;
    letter-spacing: 0.15em;
    color: rgba(255,248,236,0.4);
  }

  @media (max-width: 480px) {
    main { padding-top: 44px; padding-bottom: 90px; }
    .lanterns { height: 300px; margin-top: 20px; }
    .hint { margin-top: 18px; }
  }

  .lanterns {
    position: relative;
    height: 360px;
    margin-top: 32px;
  }

  .lantern {
    position: absolute;
    width: 56px;
    height: 74px;
    cursor: pointer;
    animation: float 6s ease-in-out infinite;
    transition: transform 0.3s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .lantern:hover { transform: translateY(-6px); }

  .lantern-body {
    width: 100%;
    height: 100%;
    position: relative;
  }
  .lantern-body::before {
    content: '';
    position: absolute;
    top: 6px;
    left: 50%;
    transform: translateX(-50%);
    width: 46px;
    height: 60px;
    border-radius: 50% / 40%;
    background: radial-gradient(circle at 50% 40%, var(--gold-soft), var(--gold) 70%);
    box-shadow: 0 0 18px rgba(242,181,68,0.6), 0 0 40px rgba(242,181,68,0.25);
    animation: invitePulse 2.6s ease-in-out infinite;
  }
  .lantern-body::after {
    content: '';
    position: absolute;
    top: -6px;
    left: 50%;
    transform: translateX(-50%);
    width: 8px;
    height: 10px;
    background: #8a6a2a;
    border-radius: 2px;
  }
  .lantern .string {
    position: absolute;
    top: -34px;
    left: 50%;
    width: 1px;
    height: 34px;
    background: rgba(255,255,255,0.15);
  }
  .lantern.secret .lantern-body::before {
    background: radial-gradient(circle at 50% 40%, var(--sakura-soft), var(--sakura) 70%);
    box-shadow: 0 0 18px rgba(255,111,145,0.5), 0 0 40px rgba(255,111,145,0.2);
  }
  .lantern.read .lantern-body::before {
    filter: brightness(0.55) saturate(0.7);
    box-shadow: 0 0 8px rgba(242,181,68,0.25);
    animation: none;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-14px); }
  }
  @keyframes invitePulse {
    0%, 100% { box-shadow: 0 0 18px rgba(242,181,68,0.6), 0 0 40px rgba(242,181,68,0.25); }
    50% { box-shadow: 0 0 26px rgba(242,181,68,0.85), 0 0 56px rgba(242,181,68,0.4); }
  }

  /* ============ メッセージウォール ============ */
  .wall-title {
    font-family: 'Shippori Mincho', serif;
    font-size: 15px;
    letter-spacing: 0.2em;
    color: var(--gold-soft);
    margin: 64px 0 28px;
  }

  .wall {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 18px;
    text-align: left;
  }

  .card {
    background: var(--paper-card);
    color: var(--ink);
    border-radius: 4px;
    padding: 20px 20px 18px;
    box-shadow: 0 10px 24px rgba(0,0,0,0.25);
    position: relative;
  }
  .card::before {
    content: '';
    position: absolute;
    top: -6px;
    left: 24px;
    width: 30px;
    height: 12px;
    background: rgba(255,255,255,0.5);
    border: 1px solid rgba(0,0,0,0.05);
    transform: rotate(-3deg);
  }
  .card:nth-child(3n)::before { transform: rotate(2deg); left: auto; right: 24px; }
  .card:nth-child(3n+1) { transform: rotate(-0.6deg); }
  .card:nth-child(3n+2) { transform: rotate(0.5deg); }
  .card:nth-child(3n)   { transform: rotate(-0.3deg); }

  .card .msg {
    font-size: 13.5px;
    line-height: 1.85;
    margin: 0 0 14px;
    white-space: pre-line;
  }
  .card .from {
    font-family: 'Shippori Mincho', serif;
    font-size: 12.5px;
    text-align: right;
    color: #8a6a3a;
  }
  .card .from::before {
    content: 'from ';
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 10.5px;
    color: #b09060;
  }

  /* ============ オーバーレイ（サプライズ） ============ */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(10,10,26,0.92);
    backdrop-filter: blur(4px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease;
    overflow-y: auto;
  }
  .overlay.show {
    opacity: 1;
    pointer-events: auto;
  }

  .overlay-card {
    max-width: 480px;
    width: 100%;
    text-align: center;
    transform: scale(0.9);
    transition: transform 0.5s cubic-bezier(.2,.9,.3,1.3);
    padding: 40px 0 20px;
  }
  .overlay.show .overlay-card {
    transform: scale(1);
  }

  .overlay-eyebrow {
    font-size: 11px;
    letter-spacing: 0.3em;
    color: var(--sakura-soft);
    margin-bottom: 14px;
  }

  .overlay-avatar {
    width: 84px;
    height: 84px;
    margin: 0 auto 18px;
    border-radius: 50%;
    padding: 4px;
    background: conic-gradient(from 0deg, var(--sakura), var(--gold-soft), var(--sakura-soft), var(--sakura));
  }
  .overlay-avatar img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    background: var(--night-deep);
  }

  .overlay h2 {
    font-family: 'Shippori Mincho', serif;
    font-size: clamp(26px, 7vw, 38px);
    line-height: 1.5;
    margin: 0 0 16px;
    color: var(--paper);
  }

  .overlay > .overlay-card > p {
    font-size: 14px;
    line-height: 1.9;
    color: rgba(255,248,236,0.75);
    margin: 0 0 8px;
  }

  .overlay .wall-title {
    margin: 40px 0 20px;
  }

  .close-btn {
    background: none;
    border: 1px solid rgba(255,248,236,0.3);
    color: var(--paper);
    padding: 10px 28px;
    border-radius: 999px;
    font-size: 13px;
    letter-spacing: 0.08em;
    cursor: pointer;
    font-family: inherit;
    margin-top: 36px;
  }
  .close-btn:hover {
    border-color: var(--gold-soft);
    color: var(--gold-soft);
  }

  canvas#confetti {
    position: fixed;
    inset: 0;
    z-index: 11;
    pointer-events: none;
  }

  /* ============ 1通ずつ出るメッセージポップアップ ============ */
  .msg-overlay {
    position: fixed;
    inset: 0;
    z-index: 12;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(10,10,26,0.7);
    backdrop-filter: blur(3px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.45s ease;
  }
  .msg-overlay.show {
    opacity: 1;
    pointer-events: auto;
  }
  .msg-overlay .card {
    max-width: 320px;
    width: 100%;
    transform: scale(0.85) translateY(10px);
    transition: transform 0.45s cubic-bezier(.2,.9,.3,1.3);
  }
  .msg-overlay.show .card {
    transform: scale(1) translateY(0);
  }
  .msg-overlay .card .msg {
    font-size: 14.5px;
  }

  /* ============ 「残り1つ」案内 ============ */
  .progress-hint {
    margin-top: 20px;
    font-family: 'Shippori Mincho', serif;
    font-size: 14px;
    letter-spacing: 0.15em;
    color: var(--gold-soft);
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.9s ease, transform 0.9s ease;
    text-shadow: 0 0 16px rgba(242,181,68,0.5);
  }
  .progress-hint.show {
    opacity: 1;
    transform: translateY(0);
  }

  /* 進捗ドット */
  .progress-dots {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 18px;
  }
  .progress-dots .dot-item {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: rgba(255,248,236,0.2);
    transition: background 0.4s ease, transform 0.4s ease;
  }
  .progress-dots .dot-item.filled {
    background: var(--gold-soft);
    box-shadow: 0 0 8px rgba(242,181,68,0.7);
    transform: scale(1.15);
  }

  /* 早押し用の軽いツールチップ */
  .tease {
    position: fixed;
    left: 50%;
    bottom: 48px;
    transform: translateX(-50%) translateY(10px);
    background: rgba(255,248,236,0.95);
    color: var(--ink);
    padding: 10px 20px;
    border-radius: 999px;
    font-size: 12.5px;
    letter-spacing: 0.05em;
    z-index: 20;
    opacity: 0;
    transition: opacity 0.4s ease, transform 0.4s ease;
    pointer-events: none;
  }
  .tease.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ============ 受け渡しクッション画面 ============ */
  .handoff-overlay {
    position: fixed;
    inset: 0;
    z-index: 13;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(10,10,26,0.94);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease;
  }
  .handoff-overlay.show {
    opacity: 1;
    pointer-events: auto;
  }
  .handoff-card {
    max-width: 340px;
    text-align: center;
    transform: translateY(12px);
    transition: transform 0.5s ease;
  }
  .handoff-overlay.show .handoff-card {
    transform: translateY(0);
  }

  .avatar-x {
    width: 76px;
    height: 76px;
    border-radius: 50%;
    margin: 0 auto 24px;
    position: relative;
    background: rgba(255,248,236,0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.55;
    animation: avatarPulse 2.4s ease-in-out infinite;
    overflow: hidden;
  }
  .avatar-x img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    display: block;
  }
  .avatar-x svg {
    width: 34px;
    height: 34px;
    opacity: 0.6;
  }
  .avatar-x .x-badge {
    position: absolute;
    bottom: -2px;
    right: -2px;
    width: 24px;
    height: 24px;
    background: #000;
    border: 2px solid var(--night-deep);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    color: #fff;
    z-index: 1;
  }
  @keyframes avatarPulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 0.75; }
  }

  .handoff-eyebrow {
    font-size: 11px;
    letter-spacing: 0.3em;
    color: rgba(255,248,236,0.45);
    margin-bottom: 14px;
  }

  .handoff-card p.main-line {
    font-family: 'Shippori Mincho', serif;
    font-size: 19px;
    line-height: 1.8;
    color: var(--paper);
    margin: 0 0 10px;
  }

  .handoff-card p.sub-line {
    font-size: 13px;
    line-height: 1.8;
    color: rgba(255,248,236,0.55);
    margin: 0 0 32px;
  }

  .handoff-btn {
    background: linear-gradient(135deg, var(--gold), var(--gold-soft));
    border: none;
    color: #2a1c05;
    padding: 12px 34px;
    border-radius: 999px;
    font-size: 13.5px;
    font-weight: 700;
    letter-spacing: 0.1em;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 0 6px 20px rgba(242,181,68,0.35);
  }

  @media (prefers-reduced-motion: reduce) {
    .lantern, .star, .petal, .hero-avatar { animation: none; }
  }
</style>
</head>
<body>

<div id="loading">
  <div class="loader-lantern">
    <div class="string"></div>
    <div class="body"></div>
  </div>
  <div class="loader-text">灯りをともしています<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></div>
</div>

<div class="sky"></div>
<div class="stars" id="stars"></div>
<div class="petals" id="petals"></div>

<main id="main">
  <div class="hero-avatar">
    <img id="heroAvatar" src="" alt="">
  </div>
  <div class="eyebrow">HAPPY BIRTHDAY</div>
  <h1><span class="name-slot">会長</span>、お誕生日<br>おめでとうございます</h1>
  <p class="lede">
    今日という日を、みんなでお祝いできることが嬉しいです。<br>
    これからの一年も、笑顔あふれる毎日になりますように。
  </p>

  <div class="lanterns" id="lanterns"></div>
  <div class="hint" id="hint">灯りをひとつずつ、そっと選んでみてください</div>
  <div class="progress-dots" id="progressDots"></div>
  <div class="progress-hint" id="progressHint">灯りがもうひとつ、残っています</div>
</main>

<div class="handoff-overlay" id="handoffOverlay">
  <div class="handoff-card">
    <div class="handoff-eyebrow">ちょっと待って</div>
    <div class="avatar-x">
      <img id="handoffAvatar" src="" alt="" style="display:none;">
      <svg id="handoffFallback" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="8" r="4" stroke="#fff8ec" stroke-width="1.5"/>
        <path d="M4 20c0-4 3.6-6 8-6s8 2 8 6" stroke="#fff8ec" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <div class="x-badge">𝕏</div>
    </div>
    <p class="main-line">実は、もうひとり<br>お祝いしたい人がいます。</p>
    <p class="sub-line">この端末を、そっと渡してください。</p>
    <button class="handoff-btn" id="handoffContinue">わたす</button>
  </div>
</div>

<div class="msg-overlay" id="msgOverlay">
  <div class="card" id="msgCard"></div>
</div>

<div class="tease" id="tease">まずは他の灯りから見てみてください</div>

<div class="overlay" id="overlay">
  <div class="overlay-card">
    <div class="overlay-eyebrow">SURPRISE MESSAGE</div>
    <div class="overlay-avatar">
      <img id="overlayAvatar" src="" alt="">
    </div>
    <h2>古谷さん<br>就任1周年<br>おめでとうございます</h2>

    <div class="wall-title">みんなからのメッセージ</div>
    <div class="wall" id="anniversaryWall"></div>

    <button class="close-btn" id="closeBtn">とじる</button>
  </div>
</div>

<canvas id="confetti"></canvas>

<script>
  /* ============================================================
     編集ポイント①：メッセージ配列
     name: 送り主の名前 / message: メッセージ本文（改行は \n でOK）
  ============================================================ */
  const birthdayMessages = [
    { name: "松本CA オニオニ", message: "会長、誕生日おめでとうございます🥳\nこれからもCAの顔として活躍お願いします🙇" },
    { name: "松本CA ると", message: "お誕生日おめでとうございます！会長の行動力にはいつも刺激をいただいています✨また逢いに行きます！" },
    { name: "長野CA らいこう", message: "会長、お誕生日おめでとうございます🎉陰に日向にCAグループを支えていただきありがとうございます！これからもご活躍ください😊" },
  ];

  const anniversaryMessages = [
    { name: "松本CA オニオニ", message: "古谷さん\n就任1周年おめでとうございます。GOフェス東京ではお世話になりました。また、ご一緒しましょう。" },
    { name: "松本CA ると", message: "就任1周年おめでとうございます！新たなグループ Pokémon GO Club Uenoの活動応援してます！" },
    { name: "長野CA らいこう", message: "１周年おめでとうございます🎉東京GOフェスではこまやかなお心配りで不慣れな私たちをフォローしていただきありがとうございました😭新しいグループの活動を応援してます😆" },
  ];

  /* ============================================================
     編集ポイント②：写真
     GitHubリポジトリに画像をアップロードし、ファイル名をそのまま入れてください
     （index.htmlと同じ階層にアップロードした場合。フォルダに入れた場合は "images/xxx.jpg" のように）
  ============================================================ */
  const firstPersonAvatarUrl  = "llDJXHla_400x400.jpg"; // 会長（一人目）
  const secondPersonAvatarUrl = "PUHP1TQ2_400x400.jpg"; // 古谷さん（二人目・サプライズ）

  /* ============================================================ */

  // 写真の反映
  const heroAvatar = document.getElementById('heroAvatar');
  const overlayAvatar = document.getElementById('overlayAvatar');
  const handoffAvatar = document.getElementById('handoffAvatar');
  const handoffFallback = document.getElementById('handoffFallback');

  if (firstPersonAvatarUrl) {
    heroAvatar.src = firstPersonAvatarUrl;
  }
  if (secondPersonAvatarUrl) {
    overlayAvatar.src = secondPersonAvatarUrl;
    handoffAvatar.src = secondPersonAvatarUrl;
    handoffAvatar.style.display = 'block';
    if (handoffFallback) handoffFallback.style.display = 'none';
  }

  function renderWall(containerId, messages) {
    const wrap = document.getElementById(containerId);
    wrap.innerHTML = "";
    messages.forEach(m => {
      const card = document.createElement("div");
      card.className = "card";
      const msg = document.createElement("p");
      msg.className = "msg";
      msg.textContent = m.message;
      const from = document.createElement("div");
      from.className = "from";
      from.textContent = m.name;
      card.appendChild(msg);
      card.appendChild(from);
      wrap.appendChild(card);
    });
  }
  renderWall("anniversaryWall", anniversaryMessages);

  // 星を散りばめる
  const starsWrap = document.getElementById('stars');
  for (let i = 0; i < 60; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.top = Math.random() * 60 + 'vh';
    s.style.animationDelay = (Math.random() * 3) + 's';
    starsWrap.appendChild(s);
  }

  // 桜の花びらを常に降らせる（提灯が少なくても画面に動きを出す）
  const petalsWrap = document.getElementById('petals');
  for (let i = 0; i < 14; i++) {
    const p = document.createElement('div');
    p.className = 'petal';
    p.style.left = Math.random() * 100 + 'vw';
    p.style.animationDuration = (9 + Math.random() * 7) + 's';
    p.style.animationDelay = (Math.random() * 10) + 's';
    p.style.opacity = 0.3 + Math.random() * 0.3;
    p.style.width = p.style.height = (6 + Math.random() * 6) + 'px';
    petalsWrap.appendChild(p);
  }

  // 提灯を並べる（黄色い提灯＝birthdayMessagesの数だけ自動生成、最後に1つだけ secret を追加）
  const lanternsWrap = document.getElementById('lanterns');
  const total = birthdayMessages.length + 1;
  const secretIndex = total - 1; // 一番最後がサプライズ提灯

  // 見た目用の座標を自動生成（左右に散らし、上下は交互にずらす）
  const topPattern = [20, 90, 10, 110, 40, 190, 60, 150];
  const positions = [];
  for (let i = 0; i < total; i++) {
    const leftPct = total === 1 ? 50 : 10 + (80 * i) / (total - 1);
    positions.push({ left: leftPct + '%', top: topPattern[i % topPattern.length] + 'px' });
  }

  // 黄色い提灯（非secret）に、誕生日メッセージを順番に割り当てる
  const nonSecretIndexes = [];
  for (let i = 0; i < total; i++) { if (i !== secretIndex) nonSecretIndexes.push(i); }

  // 進捗ドットを描画
  const progressDots = document.getElementById('progressDots');
  const dotEls = [];
  nonSecretIndexes.forEach(() => {
    const d = document.createElement('div');
    d.className = 'dot-item';
    progressDots.appendChild(d);
    dotEls.push(d);
  });

  const readSet = new Set();
  const lanternEls = [];

  for (let i = 0; i < total; i++) {
    const l = document.createElement('div');
    l.className = 'lantern' + (i === secretIndex ? ' secret' : '');
    l.style.left = positions[i].left;
    l.style.top = positions[i].top;
    l.style.animationDelay = (i * 0.4) + 's';
    l.innerHTML = '<div class="string"></div><div class="lantern-body"></div>';
    lanternEls[i] = l;

    l.addEventListener('click', (evt) => {
      if (i === secretIndex) {
        if (readSet.size < nonSecretIndexes.length) {
          showTease();
        } else {
          openHandoff();
        }
        return;
      }

      const msgIndex = nonSecretIndexes.indexOf(i);
      const data = birthdayMessages[msgIndex];
      if (!data) return;

      showSingleMessage(data);
      burstAt(evt.clientX, evt.clientY, 46); // タップした場所で小さめの紙吹雪

      if (!readSet.has(i)) {
        readSet.add(i);
        l.classList.add('read');
        if (dotEls[msgIndex]) dotEls[msgIndex].classList.add('filled');
      }

      if (readSet.size === nonSecretIndexes.length) {
        setTimeout(() => {
          burstAt(window.innerWidth / 2, window.innerHeight / 2, 130);
          document.getElementById('progressHint').classList.add('show');
        }, 500);
      }
    });

    lanternsWrap.appendChild(l);
  }

  // 1通ずつのメッセージポップアップ
  const msgOverlay = document.getElementById('msgOverlay');
  const msgCard = document.getElementById('msgCard');

  function showSingleMessage(data) {
    msgCard.innerHTML = '';
    const msg = document.createElement('p');
    msg.className = 'msg';
    msg.textContent = data.message;
    const from = document.createElement('div');
    from.className = 'from';
    from.textContent = data.name;
    msgCard.appendChild(msg);
    msgCard.appendChild(from);
    msgOverlay.classList.add('show');
  }
  msgOverlay.addEventListener('click', () => msgOverlay.classList.remove('show'));

  // 早押しツールチップ
  const tease = document.getElementById('tease');
  let teaseTimer = null;
  function showTease() {
    tease.classList.add('show');
    if (teaseTimer) clearTimeout(teaseTimer);
    teaseTimer = setTimeout(() => tease.classList.remove('show'), 2200);
  }

  // 受け渡しクッション画面
  const handoffOverlay = document.getElementById('handoffOverlay');
  const handoffContinue = document.getElementById('handoffContinue');

  function openHandoff() {
    handoffOverlay.classList.add('show');
  }
  handoffContinue.addEventListener('click', () => {
    handoffOverlay.classList.remove('show');
    setTimeout(openSurprise, 350);
  });

  // サプライズ表示 + 紙吹雪
  const overlay = document.getElementById('overlay');
  const closeBtn = document.getElementById('closeBtn');

  function openSurprise() {
    overlay.classList.add('show');
    burstAt(window.innerWidth / 2, window.innerHeight / 2, 160);
  }
  closeBtn.addEventListener('click', () => overlay.classList.remove('show'));
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.classList.remove('show'); });

  // 紙吹雪（タップ位置から出せるように origin を指定可能にする）
  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');
  let particles = [];
  let animId = null;
  function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();
  const colors = ['#f2b544', '#ffd98a', '#ff6f91', '#ffb3c6', '#fff8ec'];

  function burstAt(x, y, count) {
    for (let i = 0; i < count; i++) {
      particles.push({
        x: x, y: y,
        vx: (Math.random() - 0.5) * 12, vy: (Math.random() - 1.2) * 12,
        size: Math.random() * 6 + 4, color: colors[Math.floor(Math.random() * colors.length)],
        rotation: Math.random() * 360, vr: (Math.random() - 0.5) * 10, life: 0,
      });
    }
    if (!animId) animateConfetti();
  }
  function animateConfetti() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let alive = false;
    particles = particles.filter(p => p.life < 180);
    particles.forEach(p => {
      p.vy += 0.25; p.x += p.vx; p.y += p.vy; p.rotation += p.vr; p.life += 1;
      alive = true;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate((p.rotation * Math.PI) / 180);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = Math.max(0, 1 - p.life / 180);
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
      ctx.restore();
    });
    if (alive) {
      animId = requestAnimationFrame(animateConfetti);
    } else {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      animId = null;
    }
  }

  // ローディング演出 → メイン画面へ
  window.addEventListener('load', () => {
    setTimeout(() => {
      document.getElementById('loading').classList.add('hide');
      document.getElementById('main').classList.add('reveal');
    }, 2200);
  });
</script>

</body>
